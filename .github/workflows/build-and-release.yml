name: Build and Release kalengh

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }} - ${{ matrix.artifact_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: kalengh-windows
            artifact_path: out/make/squirrel.windows/x64/*
            make_args: ""
          - os: macos-latest
            artifact_name: kalengh-macos-arm64
            artifact_path: out/make/**/*.dmg
            make_args: "-- --arch=arm64"
          - os: macos-13
            artifact_name: kalengh-macos-x64
            artifact_path: out/make/**/*.dmg
            make_args: "-- --arch=x64"
          - os: ubuntu-latest
            artifact_name: kalengh-linux
            artifact_path: out/make/**/*
            make_args: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libarchive-tools \
            rpm \
            fakeroot \
            dpkg

      - name: Install npm dependencies
        run: npm install

      - name: Build Universal SystemAudioDump (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p build_native
          echo "Compiling SystemAudioDump for x86_64 (Intel)..."
          swiftc -target x86_64-apple-macosx13.0 -O src/native/SystemAudioDump/main.swift -o build_native/SystemAudioDump_x64 || true
          echo "Compiling SystemAudioDump for arm64 (Apple Silicon)..."
          swiftc -target arm64-apple-macosx13.0 -O src/native/SystemAudioDump/main.swift -o build_native/SystemAudioDump_arm64 || true
          
          if [ -f build_native/SystemAudioDump_x64 ] && [ -f build_native/SystemAudioDump_arm64 ]; then
            echo "Creating Universal Mach-O fat binary..."
            lipo -create -output src/assets/SystemAudioDump build_native/SystemAudioDump_x64 build_native/SystemAudioDump_arm64
          elif [ -f build_native/SystemAudioDump_x64 ]; then
            echo "Using x86_64 binary..."
            cp build_native/SystemAudioDump_x64 src/assets/SystemAudioDump
          elif [ -f build_native/SystemAudioDump_arm64 ]; then
            echo "Using arm64 binary..."
            cp build_native/SystemAudioDump_arm64 src/assets/SystemAudioDump
          else
            echo "Direct compilation fallback..."
            swiftc -O src/native/SystemAudioDump/main.swift -o src/assets/SystemAudioDump || echo "Retaining bundled SystemAudioDump"
          fi
          
          chmod 755 src/assets/SystemAudioDump || true
          file src/assets/SystemAudioDump || true

      - name: Package & Make Distributables
        run: npm run make ${{ matrix.make_args }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: warn

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_path }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
